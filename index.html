<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Montserrat',sans-serif;background:#1b1c1f;color:#eee;overflow:hidden}
.bar{position:fixed;inset:0 0 auto 0;height:60px;z-index:60;display:flex;align-items:center;gap:8px;padding:0 16px;background:#141518;border-bottom:1px solid #2b2d31;overflow-x:auto}
.bar b{font-family:'Cormorant Garamond',serif;font-size:19px;color:#d8b878;font-weight:600;margin-right:6px;white-space:nowrap}
.bar .t{background:#202226;color:#cfd2d7;border:1px solid #33363c;border-radius:20px;padding:8px 15px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-weight:500}
.bar .t:hover{background:#2a2d33}.bar .t.on{background:#d8b878;color:#1a150c;border-color:#d8b878;font-weight:700}
.bar .nav{margin-left:auto;display:flex;gap:6px}
.bar .nav button{width:34px;height:34px;background:#202226;color:#eee;border:1px solid #33363c;border-radius:8px;cursor:pointer}
.cmbbar{position:fixed;top:60px;left:0;right:0;height:30px;z-index:55;background:#101113;border-bottom:1px solid #24262b;color:#9a9fa8;display:flex;align-items:center;padding:0 18px;font-size:11.5px;letter-spacing:.02em}
.cmbbar b{color:#d8b878;font-weight:600;margin-right:8px;font-family:'Montserrat',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}
.frame{position:absolute;inset:90px 0 0 0;overflow-y:auto;overflow-x:hidden;background:#0c0d0f}
.stage{min-height:100%;background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif;font-size:16px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding:0 46px}
.stage a{color:inherit;text-decoration:none}
.disp{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1.04;margin:0;letter-spacing:.005em}
.kick{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin:0}
.acc{color:var(--acc)}.mut{color:var(--mut)}
.line{height:1px;background:var(--bd)}
.btn{display:inline-block;background:var(--acc);color:var(--bg);padding:14px 28px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.lnk{display:inline-block;padding:12px 0;font-size:13px;font-weight:600;border-bottom:1px solid var(--acc)}
/* nav */
.mnav{display:flex;align-items:center;justify-content:space-between;height:86px;border-bottom:1px solid var(--bd)}
.mnav .bd{display:flex;align-items:center;gap:11px}.mnav .bd img{height:30px}.mnav .bd span{font-size:13px;font-weight:600;letter-spacing:.12em}
.mnav nav{display:flex;gap:26px;align-items:center}.mnav nav a{font-size:13px;font-weight:500}
.mnav .cta{border:1px solid var(--ink);padding:9px 18px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
/* retrato placeholder */
.portrait{position:relative;background:var(--panel);overflow:hidden;border:1px solid var(--bd)}
.portrait svg{width:100%;height:100%;display:block}
.portrait .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);background:linear-gradient(transparent,rgba(0,0,0,.28))}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 8%;display:block}
.h-bleed{position:relative;min-height:640px;display:flex;align-items:flex-end;overflow:hidden}
.h-bleed .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 16%}
.h-bleed .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,15,10,.84),rgba(18,15,10,.26) 58%,transparent),linear-gradient(0deg,rgba(18,15,10,.74),transparent 52%)}
.h-bleed .in{position:relative;width:100%;max-width:1180px;margin:0 auto;padding:0 46px 74px;color:#f1ece2}
.h-bleed h1{font-size:clamp(44px,6vw,90px);margin:10px 0}.h-bleed .lead{max-width:440px;color:#e6ded0;font-size:18px;margin:16px 0 26px}
.arch svg{width:100%;height:100%;display:block}
/* heros */
.h-split2{display:grid;grid-template-columns:1.02fr .98fr;gap:56px;align-items:center;padding:74px 0 94px}
.h-split2 h1{font-size:clamp(40px,5.6vw,82px);margin:16px 0}
.h-split2 h1 .b{display:block;font-size:.5em;color:var(--acc);margin-top:12px}
.h-split2 .lead{max-width:440px;font-size:18px;color:var(--mut);margin:22px 0 28px}
.h-split2 .pf{aspect-ratio:4/4.4}
.h-full{position:relative;min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.h-full .bg{position:absolute;inset:0}.h-full .in{position:relative}.h-full img{height:150px;margin-bottom:18px}
.h-macro{padding:90px 0}.h-macro h1{font-size:clamp(56px,10vw,148px);letter-spacing:-.01em}.h-macro .w2{color:var(--acc);font-weight:500}
.h-side{display:grid;grid-template-columns:440px 1fr;min-height:620px}
.h-side .pane{position:relative}.h-side .pane .portrait{position:absolute;inset:0;border:0}
.h-side .rt{padding:70px 54px;display:flex;flex-direction:column;justify-content:center}
.h-side .rt h1{font-size:clamp(38px,4.6vw,62px);margin:14px 0}
.h-idx{padding:70px 0 40px}.h-idx h1{font-size:clamp(34px,4.6vw,60px);margin:8px 0 30px}
.idxrow{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-top:1px solid var(--bd)}
.idxrow:last-child{border-bottom:1px solid var(--bd)}.idxrow .r{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--acc);width:52px}
.idxrow .t{flex:1;font-family:'Cormorant Garamond',serif;font-size:30px}.idxrow .c{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
/* seções */
.sec{padding:88px 0;border-top:1px solid var(--bd)}
.sec .hd{margin-bottom:40px}.sec h2{font-size:clamp(28px,4vw,46px);margin:8px 0}
.rows .row{display:grid;grid-template-columns:64px 1fr 1.1fr 30px;gap:18px;align-items:center;padding:26px 0;border-top:1px solid var(--bd)}
.rows .row:last-child{border-bottom:1px solid var(--bd)}
.rows .n{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--acc)}.rows h3{font-family:'Cormorant Garamond',serif;font-size:30px;margin:0}
.rows p{margin:0;color:var(--mut);font-size:15px}.rows .ar{justify-self:end}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{border:1px solid var(--bd);padding:32px;transition:.25s}.card:hover{border-color:var(--acc)}
.card .n{font-family:'Cormorant Garamond',serif;color:var(--acc);font-size:22px}.card h3{font-family:'Cormorant Garamond',serif;font-size:24px;margin:8px 0 8px}.card p{margin:0;color:var(--mut);font-size:14.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.two p{color:var(--mut);margin:0 0 18px;font-size:17px}
.creds .r{display:flex;gap:22px;padding:15px 0;border-top:1px solid var(--bd);align-items:baseline}.creds .r:last-child{border-bottom:1px solid var(--bd)}
.creds .k{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);min-width:116px}.creds .v{font-family:'Cormorant Garamond',serif;font-size:23px}
.quote{background:var(--ink);color:var(--bg);text-align:center;padding:100px 0}
.quote .q{font-family:'Cormorant Garamond',serif;font-size:56px;color:var(--acc);line-height:0;height:28px;display:block}
.quote h2{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,3.6vw,44px);font-weight:500;max-width:800px;margin:28px auto 22px}
.quote .w{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.mag{display:grid;grid-template-columns:1.15fr .85fr;gap:44px}
.mag .thumb{aspect-ratio:16/8.5;margin-bottom:16px}.mag .side{border-left:1px solid var(--bd);padding-left:28px}
.mag .a{padding:17px 0;border-bottom:1px solid var(--bd)}.mag .cat{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.mag h3{font-family:'Cormorant Garamond',serif;font-size:23px;margin:6px 0 0}
.cont{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:start}
.cinfo .r{padding:20px 0;border-top:1px solid var(--bd)}.cinfo .r:last-child{border-bottom:1px solid var(--bd)}
.cinfo .k{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}.cinfo .v{font-family:'Cormorant Garamond',serif;font-size:23px;margin-top:5px}
form.mini{background:var(--ink);color:var(--bg);padding:40px}
form.mini label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0 0 7px;font-weight:600}
form.mini input,form.mini textarea{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(128,128,128,.4);color:var(--bg);padding:8px 0;margin-bottom:18px;font:inherit}
form.mini button{width:100%;border:0;background:var(--acc);color:var(--ink);padding:15px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
.foot{background:var(--ink);color:var(--mut);padding:64px 0 40px}
.foot .top{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;padding-bottom:34px;border-bottom:1px solid rgba(128,128,128,.2)}
.foot img{height:60px;margin-bottom:12px}.foot .nm{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--bg)}

 {k:"Contemporâneo Assinado",f:d_macro,p:"pedra",c:"Macro-tipografia × acento latão · contemporâneo minimal"}
];
var cur=0;
function render(i){cur=(i+DIRS.length)%DIRS.length;var d=DIRS[cur],p=PALS[d.p],st=document.getElementById("stage");
 st.style.cssText="--bg:"+p.bg+";--ink:"+p.ink+";--bg2:"+p.bg2+";--acc:"+p.acc+";--mut:"+p.mut+";--bd:"+p.bd+";--panel:"+p.panel;
 st.innerHTML=d.f(p);
 document.querySelectorAll('.bar .t').forEach(function(b,j){b.classList.toggle('on',j===cur);});
 document.getElementById("cmb").textContent=d.c;
 document.getElementById("frame").scrollTop=0;location.hash="d="+cur;
 st.querySelectorAll('[data-s]').forEach(function(a){a.style.cursor="pointer";a.onclick=function(e){e.preventDefault();var el=document.getElementById(a.getAttribute("data-s"));if(el)el.scrollIntoView({behavior:"smooth"});};});
}
window.addEventListener("DOMContentLoaded",function(){
 var bar=document.getElementById("tabs");
 DIRS.forEach(function(d,i){var b=document.createElement("button");b.className="t";b.textContent=(i+1)+" · "+d.k;b.onclick=function(){render(i);};bar.appendChild(b);});
 document.getElementById("prev").onclick=function(){render(cur-1);};
 document.getElementById("next").onclick=function(){render(cur+1);};
 document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")render(cur+1);if(e.key==="ArrowLeft")render(cur-1);});
 var h=location.hash.match(/d=(\d+)/);render(h?+h[1]:0);
});
