html,body{margin:0;height:100%}

.stage{min-height:100%;background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 46px}
.stage a{color:inherit;text-decoration:none}

 '<div class="r"><div class="k">E-mail</div><div class="v"><a href="mailto:'+MAIL+'">'+MAIL+'</a></div></div>'+
 '<div class="r"><div class="k">Endereço</div><div class="v" style="font-size:18px">'+END+'</div></div>'+
 '<div class="r"><div class="k">Atendimento</div><div class="v" style="font-size:18px">Seg. a sex., 8h às 18h</div></div></div>'+
 '<form class="mini" onsubmit="return sendWA(this)"><label>Nome</label><input name="nome" required><label>Mensagem</label><textarea name="msg" rows="3" required></textarea><button>Enviar pelo WhatsApp</button></form>'+
 '</div></div></section>';}
function footer(p){return '<footer class="foot"><div class="wrap" style="display:flex;justify-content:space-between;width:100%;gap:20px;flex-wrap:wrap"><div><img src="'+mk(p)+'" alt=""><div style="font-family:var(--disp);font-size:22px;margin-top:8px">Lidiane França Dias</div></div>'+
 '<div style="max-width:520px;font-size:11px;line-height:1.6">OAB/MG 207.054 · Conteúdo meramente informativo (Provimento 205/2021 OAB). Não constitui oferta de serviços nem promessa de resultados. © 2026 Lidiane França Dias.</div></div></footer>';}
function sendWA(f){var t="Olá! Meu nome é "+(f.nome.value||"—")+". "+(f.msg.value||"");window.open(WA+"?text="+encodeURIComponent(t),"_blank","noopener");return false;}
function render(i){var m=M[i],p=m.pal,st=document.getElementById("stage");
 st.style.cssText="--bg:"+p.bg+";--ink:"+p.ink+";--acc:"+p.acc+";--mut:"+p.mut+";--disp:"+p.disp;
 var html='<div class="wrap">'+TPL[m.tpl](m,p)+'</div>';
 if(["list","index","mag"].indexOf(m.tpl)<0) html+=secAreas(p);
 html+=secContato(p)+footer(p);
 st.innerHTML=html;
 document.getElementById("lbl").innerHTML='Modelo <em>'+pad(m.n)+'</em> · '+m.ref+' <span class="tag" style="margin-left:8px">'+m.cat+'</span>';
 document.getElementById("sel").value=i; location.hash="m="+m.n;
 document.getElementById("frame").scrollTop=0;
 st.querySelectorAll('[data-s]').forEach(function(a){a.style.cursor="pointer";a.onclick=function(e){e.preventDefault();var el=document.getElementById(a.getAttribute("data-s"));if(el)el.scrollIntoView({behavior:"smooth"});};});
}
function pad(n){return (n<10?"0":"")+n;}
var cur=0;
function go(d){cur=(cur+d+M.length)%M.length;render(cur);}
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);});
window.addEventListener("DOMContentLoaded",function(){
 var sel=document.getElementById("sel"),cats={},html="";
 M.forEach(function(m,i){if(!cats[m.cat]){cats[m.cat]=1;html+=(i?'</optgroup>':'')+'<optgroup label="'+m.cat+'">';}
  html+='<option value="'+i+'">'+pad(m.n)+' · '+m.ref+'</option>';});
 html+='</optgroup>';sel.innerHTML=html;
 sel.onchange=function(){cur=+sel.value;render(cur);};
 document.getElementById("prev").onclick=function(){go(-1);};
 document.getElementById("next").onclick=function(){go(1);};
 var h=location.hash.match(/m=(\d+)/);if(h){var n=+h[1];M.forEach(function(m,i){if(m.n===n)cur=i;});}
 render(cur);
});
</script></body></html>
